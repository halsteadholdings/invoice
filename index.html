<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halstead Residential — Contractor Invoice</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root { --ink:#1a1a1a; --muted:#6b6b6b; --line:#e3ddd6; --brand:#F58220; --brand-dark:#B85E12; --accent:#F58220; --bg:#faf7f3; --err:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width:620px; margin:0 auto; padding:24px 16px 48px; }
  .brandbar { background:#1a1a1a; padding:18px 16px; }
  .brandbar .in { max-width:620px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .brandbar svg { height:36px; width:auto; }
  .wordmark { font-family:Georgia,'Times New Roman',serif; color:#fff; letter-spacing:.32em; font-size:18px; }
  .wordmark small { display:block; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; letter-spacing:.12em; font-size:10px; color:var(--brand); margin-top:3px; }
  header h1 { font-family:Georgia,'Times New Roman',serif; font-weight:400; font-size:26px; margin:0 0 4px; }
  header p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  header { border-left:4px solid var(--brand); padding-left:12px; margin-bottom:20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:16px; }
  label { display:block; font-size:13px; font-weight:600; margin:0 0 6px; }
  .field { margin-bottom:14px; }
  input, select, textarea { width:100%; font:inherit; font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  textarea { min-height:110px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent); }
  .row { display:flex; gap:10px; align-items:flex-start; }
  .row .grow { flex:1; }
  .row .amt { width:130px; }
  .line { margin-bottom:10px; }
  .x { border:none; background:none; color:var(--muted); font-size:22px; line-height:1; padding:8px 4px; cursor:pointer; }
  .btn { display:inline-block; font:inherit; font-size:16px; font-weight:600; border-radius:8px; padding:12px 16px; cursor:pointer; border:1px solid var(--accent); }
  .btn-primary { background:var(--brand); border-color:var(--brand); color:#1a1a1a; width:100%; }
  .btn-primary:hover { background:#e9741a; }
  .btn-primary:disabled { opacity:.6; cursor:wait; }
  .btn-ghost { background:#fff; color:var(--brand-dark); border-color:var(--brand); }
  .total span:last-child { color:var(--brand-dark); }
  .total { display:flex; justify-content:space-between; font-size:18px; font-weight:700; border-top:1px solid var(--line); padding-top:12px; margin-top:6px; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .error { color:var(--err); font-size:14px; margin:10px 0 0; min-height:1em; }
  #done { display:none; text-align:center; }
  #done h2 { margin:6px 0; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="brandbar"><div class="in">
  <svg viewBox="50 30 300 280" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="#F58220">
    <rect x="60" y="40" width="20" height="260"/><rect x="100" y="40" width="20" height="260"/><rect x="140" y="40" width="20" height="260"/>
    <rect x="240" y="40" width="20" height="260"/><rect x="280" y="40" width="20" height="260"/><rect x="320" y="40" width="20" height="260"/>
    <rect x="140" y="140" width="120" height="20"/><rect x="140" y="175" width="120" height="20"/><rect x="140" y="210" width="120" height="20"/></g></svg>
  <div class="wordmark">HALSTEAD<small>RESIDENTIAL</small></div>
</div></div>
<main>
  <header>
    <h1>Contractor Invoice</h1>
    <p>Fill this out when the job is done. We'll get the invoice automatically.</p>
  </header>

  <form id="f" novalidate>
    <div class="card">
      <div class="field">
        <label for="name">Your name or company</label>
        <input id="name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input id="phone" type="tel" autocomplete="tel" required>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label for="property">Property</label>
        <select id="property" required></select>
      </div>
      <div class="field hidden" id="otherWrap">
        <label for="otherProperty">Property address</label>
        <input id="otherProperty">
      </div>
      <div class="field">
        <label for="unit">Unit <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
        <input id="unit" placeholder="e.g. 3B, or Common area">
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label for="details">Job details</label>
        <textarea id="details" placeholder="What did you do? e.g. Replaced kitchen faucet and supply lines, fixed leak under sink." required></textarea>
      </div>
      <label>Charges</label>
      <div id="lines"></div>
      <button type="button" class="btn btn-ghost" id="addLine">+ Add a charge</button>
      <div class="total"><span>Total</span><span id="total">$0.00</span></div>
    </div>

    <div class="card">
      <div class="field" style="margin-bottom:0">
        <label for="receipts">Receipts <span style="font-weight:400;color:var(--muted)">(optional — photos or PDFs)</span></label>
        <input id="receipts" type="file" accept="image/*,application/pdf" multiple>
        <div class="hint">Add receipts for any materials you're billing for.</div>
      </div>
    </div>

    <button class="btn btn-primary" id="submit" type="submit">Submit invoice</button>
    <p class="error" id="err" role="alert"></p>
  </form>

  <div class="card" id="done">
    <h2>Invoice submitted</h2>
    <p id="doneMsg"></p>
    <p class="hint">Payments go out on the 5th and 20th of each month by ACH.</p>
    <p class="hint" id="emailHint"></p>
    <p><button class="btn btn-ghost" id="dl" type="button">Download a copy</button></p>
    <p><button class="btn btn-ghost" id="another" type="button">Submit another invoice</button></p>
  </div>
</main>

<script>
/* ================= CONFIG — edit these ================= */
const CONFIG = {
  // Make.com custom webhook URL. Leave blank to test: the form will just download the PDF.
  WEBHOOK_URL: "https://hook.us2.make.com/ywd6mws1gcfu0vzoiir8xtuank3pwh77",
  COMPANY: "Halstead Residential",
  // AppFolio Smart Bill Entry address. The Make scenario sends invoices here; also shown to contractors as a fallback.
  INVOICE_EMAIL: "halsteadholdings@invoices.appfolio.com",
  // Shown on the invoice under "Bill to". Add/remove properties as needed.
  PROPERTIES: [
    "3567 Bosworth Rd",
    "1908 Broadview Ct",
    "2097 Columbus Rd",
    "29200 Detroit Rd",
    "29655 Detroit Rd",
    "15207 Madison Ave",
    "17105 Madison Ave",
    "23000 Mastick Rd",
    "4135 Rocky River Dr",
    "4396 Rocky River Dr",
    "3307 Scranton Rd",
    "2711 W 14th St",
    "3726 W 159th St",
    "3727 W 159th St",
  ],
  // City/state/zip printed under the street address so AppFolio matches the right property.
  CITY: {
    "1908 Broadview Ct": "Cleveland, OH 44109",
    "2097 Columbus Rd": "Cleveland, OH 44113",
    "3307 Scranton Rd": "Cleveland, OH 44109",
    "3567 Bosworth Rd": "Cleveland, OH 44111",
    "3726 W 159th St": "Cleveland, OH 44111",
    "3727 W 159th St": "Cleveland, OH 44111",
    "2711 W 14th St": "Cleveland, OH 44113",
    "17105 Madison Ave": "Lakewood, OH 44107",
    "23000 Mastick Rd": "North Olmsted, OH 44070",
  },
};
/* ======================================================= */

const $ = id => document.getElementById(id);
let lastPdf = null, lastFilename = "";

// Property dropdown
(function initProperties() {
  const sel = $("property");
  sel.add(new Option("Select a property…", ""));
  CONFIG.PROPERTIES.forEach(p => sel.add(new Option(p, p)));
  sel.add(new Option("Other (type address)", "__other"));
  sel.addEventListener("change", () => $("otherWrap").classList.toggle("hidden", sel.value !== "__other"));
})();

// Remember the contractor's name/phone on this device
try {
  $("name").value = localStorage.getItem("hi_name") || "";
  $("phone").value = localStorage.getItem("hi_phone") || "";
} catch (e) {}

// Charge lines
function addLine(desc = "", amt = "") {
  const div = document.createElement("div");
  div.className = "row line";
  div.innerHTML = `
    <input class="grow ldesc" placeholder="Labor, materials, etc." aria-label="Charge description">
    <input class="amt lamt" inputmode="decimal" placeholder="$0.00" aria-label="Amount">
    <button type="button" class="x" aria-label="Remove charge">×</button>`;
  div.querySelector(".ldesc").value = desc;
  div.querySelector(".lamt").value = amt;
  div.querySelector(".lamt").addEventListener("input", updateTotal);
  div.querySelector(".x").addEventListener("click", () => {
    if (document.querySelectorAll(".line").length > 1) div.remove(); else { div.querySelector(".ldesc").value=""; div.querySelector(".lamt").value=""; }
    updateTotal();
  });
  $("lines").appendChild(div);
}
const parseAmt = s => { const n = parseFloat(String(s).replace(/[^0-9.\-]/g, "")); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
const money = n => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function getLines() {
  return [...document.querySelectorAll(".line")].map(l => ({
    desc: l.querySelector(".ldesc").value.trim(),
    amt: parseAmt(l.querySelector(".lamt").value),
  })).filter(l => l.desc || l.amt);
}
function updateTotal() { $("total").textContent = money(getLines().reduce((s, l) => s + l.amt, 0)); }
$("addLine").addEventListener("click", () => addLine());
addLine("Labor"); addLine("Materials");

// ---------- PDF ----------
// Standard PDF fonts only cover basic characters; replace the rest.
function clean(s) {
  return String(s || "")
    .replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
    .replace(/[–—]/g, "-").replace(/…/g, "...")
    .replace(/\r/g, "").replace(/[^\x20-\x7E\n]/g, "");
}
function wrap(text, font, size, maxW) {
  const out = [];
  clean(text).split("\n").forEach(para => {
    const words = para.split(/\s+/).filter(Boolean);
    if (!words.length) { out.push(""); return; }
    let line = "";
    words.forEach(w => {
      const t = line ? line + " " + w : w;
      if (font.widthOfTextAtSize(t, size) <= maxW) line = t;
      else {
        if (line) out.push(line);
        // break very long words
        while (font.widthOfTextAtSize(w, size) > maxW) {
          let i = w.length; while (i > 1 && font.widthOfTextAtSize(w.slice(0, i), size) > maxW) i--;
          out.push(w.slice(0, i)); w = w.slice(i);
        }
        line = w;
      }
    });
    if (line) out.push(line);
  });
  return out;
}

async function imageToJpeg(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600, scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.75));
    return new Uint8Array(await blob.arrayBuffer());
  } finally { URL.revokeObjectURL(url); }
}

async function buildPdf(d) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdf = await PDFDocument.create();
  pdf.setTitle(`Invoice ${d.invoiceNo}`); pdf.setAuthor(clean(d.name));
  const reg = await pdf.embedFont(StandardFonts.Helvetica);
  const bold = await pdf.embedFont(StandardFonts.HelveticaBold);
  const W = 612, H = 792, M = 54, ink = rgb(0.11, 0.14, 0.19), muted = rgb(0.42, 0.45, 0.5), line = rgb(0.85, 0.87, 0.89);
  let page = pdf.addPage([W, H]), y = H - M;
  const text = (s, x, yy, o = {}) => page.drawText(clean(s), { x, y: yy, size: o.size || 10, font: o.bold ? bold : reg, color: o.color || ink });
  const right = (s, xr, yy, o = {}) => { const f = o.bold ? bold : reg, sz = o.size || 10; text(s, xr - f.widthOfTextAtSize(clean(s), sz), yy, o); };
  const newPageIfNeeded = need => { if (y - need < M + 40) { page = pdf.addPage([W, H]); y = H - M; } };

  // Header: Halstead H mark + wordmark, amount due on the right
  const brand = rgb(0.961, 0.510, 0.125), brandDark = rgb(0.722, 0.369, 0.071);
  const serif = await pdf.embedFont(StandardFonts.TimesRoman);
  const ls = 0.16, top = y;
  [[60,40,20,260],[100,40,20,260],[140,40,20,260],[240,40,20,260],[280,40,20,260],[320,40,20,260],
   [140,140,120,20],[140,175,120,20],[140,210,120,20]].forEach(([rx, ry, rw, rh]) =>
    page.drawRectangle({ x: M + (rx - 60) * ls, y: top - (ry - 40 + rh) * ls, width: rw * ls, height: rh * ls, color: brand }));
  let wx = M + 280 * ls + 12;
  for (const ch of "HALSTEAD") { page.drawText(ch, { x: wx, y: top - 22, size: 17, font: serif, color: ink }); wx += serif.widthOfTextAtSize(ch, 17) + 4.5; }
  let rx2 = M + 280 * ls + 12;
  for (const ch of "RESIDENTIAL") { page.drawText(ch, { x: rx2, y: top - 36, size: 7.5, font: bold, color: brand }); rx2 += bold.widthOfTextAtSize(ch, 7.5) + 2.2; }
  right("AMOUNT DUE", W - M, top - 8, { size: 9, color: muted, bold: true });
  right(money(d.total), W - M, top - 30, { size: 20, bold: true });
  y = top - 260 * ls - 14;
  page.drawRectangle({ x: M, y, width: W - 2 * M, height: 2, color: brand });
  y -= 34;
  page.drawText("Invoice", { x: M, y, size: 24, font: serif, color: ink });
  y -= 30;

  // From / Bill to / Invoice info
  const col2 = 230, col3 = 410;
  text("FROM", M, y, { size: 8, bold: true, color: muted });
  text("PROPERTY", col2, y, { size: 8, bold: true, color: muted });
  text("INVOICE #", col3, y, { size: 8, bold: true, color: muted });
  y -= 14;
  const fromLines = wrap(d.name, bold, 11, col2 - M - 12);
  const billLines = [...wrap(d.property, bold, 11, col3 - col2 - 12)];
  if (CONFIG.CITY[d.property]) billLines.push(CONFIG.CITY[d.property]);
  if (d.unit) billLines.push("Unit " + d.unit.replace(/^unit\s*/i, ""));
  let yy = y;
  fromLines.forEach(l => { text(l, M, yy, { size: 11, bold: true }); yy -= 14; });
  text(d.phone, M, yy, { size: 10 });
  yy = y; billLines.forEach((l, i) => { text(l, col2, yy, { size: i ? 10 : 11, bold: i === 0 }); yy -= 14; });
  text(d.invoiceNo, col3, y, { size: 10 });
  text("DATE", col3, y - 22, { size: 8, bold: true, color: muted });
  text(d.dateStr, col3, y - 36, { size: 10 });
  y -= Math.max(fromLines.length * 14 + 14, billLines.length * 14, 40) + 24;

  // Job details
  text("JOB DETAILS", M, y, { size: 8, bold: true, color: muted }); y -= 15;
  wrap(d.details, reg, 10.5, W - 2 * M).forEach(l => { newPageIfNeeded(14); text(l, M, y, { size: 10.5 }); y -= 14; });
  y -= 16;

  // Charges table
  newPageIfNeeded(60);
  page.drawRectangle({ x: M, y: y - 6, width: W - 2 * M, height: 20, color: rgb(0.996, 0.945, 0.894) });
  text("DESCRIPTION", M + 8, y, { size: 8, bold: true, color: muted });
  right("AMOUNT", W - M - 8, y, { size: 8, bold: true, color: muted });
  y -= 24;
  d.lines.forEach(l => {
    const dl = wrap(l.desc || "-", reg, 10.5, W - 2 * M - 120);
    newPageIfNeeded(dl.length * 14 + 10);
    dl.forEach((s, i) => { text(s, M + 8, y - i * 14, { size: 10.5 }); });
    right(money(l.amt), W - M - 8, y, { size: 10.5 });
    y -= dl.length * 14 + 6;
    page.drawLine({ start: { x: M, y: y + 2 }, end: { x: W - M, y: y + 2 }, thickness: 0.5, color: line });
    y -= 10;
  });
  newPageIfNeeded(40);
  text("TOTAL", W - M - 160, y - 4, { size: 11, bold: true });
  right(money(d.total), W - M - 8, y - 4, { size: 13, bold: true, color: brandDark });
  y -= 30;
  if (d.receiptCount) { text(`${d.receiptCount} receipt${d.receiptCount > 1 ? "s" : ""} attached on following page${d.receiptCount > 1 ? "s" : ""}.`, M, y, { size: 9, color: muted }); }

  // Footer
  pdf.getPages().forEach(p => {
    p.drawText(clean(`Submitted ${d.submittedStr} via Halstead contractor invoice form  |  ${d.invoiceNo}`),
      { x: M, y: 30, size: 7.5, font: reg, color: muted });
  });

  // Receipts
  let n = 0;
  for (const f of d.receipts) {
    try {
      if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
        const src = await PDFDocument.load(await f.arrayBuffer(), { ignoreEncryption: true });
        const pages = await pdf.copyPages(src, src.getPageIndices());
        pages.forEach(p => pdf.addPage(p));
      } else {
        const jpg = await pdf.embedJpg(await imageToJpeg(f));
        const p = pdf.addPage([W, H]);
        p.drawText(clean(`Receipt ${++n} - ${d.invoiceNo}`), { x: M, y: H - M + 10, size: 9, font: bold, color: muted });
        const s = Math.min((W - 2 * M) / jpg.width, (H - 2 * M - 10) / jpg.height);
        p.drawImage(jpg, { x: (W - jpg.width * s) / 2, y: H - M - 10 - jpg.height * s, width: jpg.width * s, height: jpg.height * s });
      }
    } catch (e) { console.warn("Skipped receipt", f.name, e); }
  }
  return await pdf.save();
}

// ---------- Submit ----------
function download(bytes, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
  a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("err"); err.textContent = "";
  const name = $("name").value.trim(), phone = $("phone").value.trim();
  const property = $("property").value === "__other" ? $("otherProperty").value.trim() : $("property").value;
  const details = $("details").value.trim(), lines = getLines();
  const total = Math.round(lines.reduce((s, l) => s + l.amt, 0) * 100) / 100;
  const missing = [];
  if (!name) missing.push("your name");
  if (phone.replace(/\D/g, "").length < 10) missing.push("a 10-digit phone number");
  if (!property) missing.push("the property");
  if (!details) missing.push("job details");
  if (!(total > 0)) missing.push("at least one charge with an amount");
  if (missing.length) { err.textContent = "Please add " + missing.join(", ") + "."; return; }

  const btn = $("submit"); btn.disabled = true; btn.textContent = "Creating invoice…";
  try {
    try { localStorage.setItem("hi_name", name); localStorage.setItem("hi_phone", phone); } catch (e) {}
    const now = new Date();
    const initials = name.split(/\s+/).map(w => w[0]).join("").replace(/[^A-Za-z]/g, "").toUpperCase().slice(0, 3) || "INV";
    const stamp = now.getFullYear() + String(now.getMonth() + 1).padStart(2, "0") + String(now.getDate()).padStart(2, "0") + "-" + String(now.getHours()).padStart(2, "0") + String(now.getMinutes()).padStart(2, "0");
    const invoiceNo = `${initials}-${stamp}`;
    const data = {
      name, phone, property, unit: $("unit").value.trim(), details, lines, total, invoiceNo,
      dateStr: now.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }),
      submittedStr: now.toLocaleString("en-US"),
      receipts: [...$("receipts").files],
    };
    data.receiptCount = data.receipts.length;
    const bytes = await buildPdf(data);
    const safe = s => clean(s).replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
    const filename = `Invoice_${invoiceNo}_${safe(property)}.pdf`;
    lastPdf = bytes; lastFilename = filename;

    if (CONFIG.WEBHOOK_URL) {
      btn.textContent = "Sending…";
      const fd = new FormData();
      fd.append("invoice_pdf", new Blob([bytes], { type: "application/pdf" }), filename);
      fd.append("invoice_number", invoiceNo);
      fd.append("contractor_name", name);
      fd.append("contractor_phone", phone);
      fd.append("property", property);
      fd.append("unit", data.unit);
      fd.append("job_details", details);
      fd.append("total", total.toFixed(2));
      fd.append("submitted_at", now.toISOString());
      let res;
      try { res = await fetch(CONFIG.WEBHOOK_URL, { method: "POST", body: fd }); }
      catch (e) { res = await fetch(CONFIG.WEBHOOK_URL, { method: "POST", body: fd, mode: "no-cors" }); } // request still delivered if CORS blocks reading the reply
      if (res.type !== "opaque" && !res.ok) throw new Error("Server responded " + res.status);
      $("doneMsg").textContent = `Invoice ${invoiceNo} for ${money(total)} was sent to ${CONFIG.COMPANY}.`;
    } else {
      download(bytes, filename);
      $("doneMsg").textContent = `Test mode: invoice ${invoiceNo} for ${money(total)} was created and downloaded (no webhook set, so nothing was sent).`;
    }
    $("f").style.display = "none"; $("done").style.display = "block"; window.scrollTo(0, 0);
  } catch (e) {
    console.error(e);
    err.textContent = lastPdf
      ? "Couldn't send the invoice. A copy was downloaded to your phone. Try again, or email that PDF to " + CONFIG.INVOICE_EMAIL + "."
      : "Couldn't create the invoice. Please try again.";
    if (lastPdf) download(lastPdf, lastFilename);
  } finally { btn.disabled = false; btn.textContent = "Submit invoice"; }
});

$("emailHint").textContent = "Questions about an invoice? Invoices can also be emailed as a PDF to " + CONFIG.INVOICE_EMAIL + ".";
